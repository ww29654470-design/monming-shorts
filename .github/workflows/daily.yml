
name: MoMing Shorts Daily

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

jobs:
  make-video:
    runs-on: ubuntu-latest
    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Install FFmpeg and Python
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg python3-pip fonts-noto-cjk
          pip install pillow

      - name: Generate animated Shorts
        run: |
          mkdir -p output
          python3 make_video.py

      - name: Save generated video
        uses: actions/upload-artifact@v4
        with:
          name: moming-shorts
          path: output/*.mp4
          if-no-files-found: error
