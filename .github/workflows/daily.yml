
name: MoMing Shorts Daily

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

jobs:
  make-video:
    runs-on: ubuntu-latest
    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Install FFmpeg and Python
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg python3-pip fonts-noto-cjk
          pip install pillow

      - name: Generate animated Shorts
        run: |
          mkdir -p output
          python3 make_video.py

      - name: Save generated video
        uses: actions/upload-artifact@v4
        with:
          name: moming-shorts
          path: output/*.mp4
          if-no-files-found: error

      - name: Upload video to Google Drive
        env:
          DRIVE_UPLOAD_URL: ${{ secrets.DRIVE_UPLOAD_URL }}
          DRIVE_UPLOAD_TOKEN: ${{ secrets.DRIVE_UPLOAD_TOKEN }}
        run: |
          python3 - <<'PY'
          import os, glob, json, base64, urllib.request

          files = glob.glob("output/*.mp4")
          if not files:
              raise Exception("找不到 MP4 影片")

          for filename in files:
              metadata_path = os.path.splitext(filename)[0] + ".json"

              with open(metadata_path, encoding="utf-8") as f:
                  metadata = json.load(f)

              with open(filename, "rb") as f:
                  video = base64.b64encode(f.read()).decode("ascii")

              payload = {
                  "token": os.environ["DRIVE_UPLOAD_TOKEN"],
                  "filename": os.path.basename(filename),
                  "file": video,
                  "title": metadata["title"],
                  "description": metadata["description"],
                  "tags": metadata["tags"]
              }

              request = urllib.request.Request(
                  os.environ["DRIVE_UPLOAD_URL"],
                  data=json.dumps(payload).encode("utf-8"),
                  headers={"Content-Type": "application/json"},
                  method="POST"
              )

              with urllib.request.urlopen(request, timeout=300) as response:
                  result = json.loads(response.read().decode("utf-8"))

              if not result.get("success"):
                  raise Exception("Google Drive 上傳失敗：" + str(result))

              print("已送到 Google Drive：" + filename)
          PY

